[package]
name = "arkguard-python"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arkguard-engine = { path = "../engine" }
pyo3 = { version = "=0.27.2", features = ["extension-module"] }

serde_json = "=1.0.149"
serde = { version = "=1.0.228", features = ["derive"] }

[build-dependencies]
pyo3-build-config = "=0.27.2"

