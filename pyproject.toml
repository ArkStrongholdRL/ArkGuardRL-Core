[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.10,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "arkguardrl-core"
version = "0.1.0"
description = "Gymnasium environment for Stronghold Protocol with Rust observation and action kernels"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]

[project.optional-dependencies]
gym = ["gymnasium>=1.1,<2", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["arkguardrl", "arkguardrl.*", "arkguardrl_core", "arkguardrl_core.*"]
namespaces = false

[tool.setuptools.package-data]
"arkguardrl.engine" = ["*.mjs"]
"arkguardrl_core.routes" = ["*.mjs"]
"arkguardrl_core" = ["native/Cargo.toml", "native/Cargo.lock", "native/src/*.rs"]

[[tool.setuptools-rust.ext-modules]]
target = "arkguardrl_core._rust_routes"
path = "arkguardrl_core/native/Cargo.toml"
binding = "PyO3"
debug = false
args = ["--locked"]
