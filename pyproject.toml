[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arkguardrl-core"
version = "0.1.0"
description = "Reusable native Stronghold Protocol RL environment, optimized sampling and batched learning"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}

[project.optional-dependencies]
train = ["torch>=2.6"]
vector = ["torch>=2.6", "numpy>=1.26"]

[project.scripts]
arkguardrl-core = "arkguardrl_core.cli:main"

[tool.setuptools.packages.find]
include = ["arkguardrl", "arkguardrl.*", "arkguardrl_core", "arkguardrl_core.*"]

[tool.setuptools.package-data]
"arkguardrl.engine" = ["*.mjs"]
"arkguardrl_core.routes" = ["*.mjs"]
