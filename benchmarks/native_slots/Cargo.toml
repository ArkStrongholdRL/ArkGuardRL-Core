[workspace]

# Isolated experiment crate: it must not join the repository workspace, so it
# keeps its own lock and can be built by CI on the same branch.
[package]
name = "native_slots"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "_native_slots"
crate-type = ["cdylib"]

[dependencies]
arkguard-engine = { path = "../../crates/engine" }
pyo3 = { version = "=0.27.2", features = ["extension-module"] }
serde_json = "=1.0.149"

[build-dependencies]
pyo3-build-config = "=0.27.2"

[profile.release]
lto = "thin"
codegen-units = 1
