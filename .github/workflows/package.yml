name: Package

on:
  push:
    branches: [codex/release-033]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Import the installed wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip install 'gymnasium>=1.1,<2' 'numpy>=1.26'
          cd "$RUNNER_TEMP"
          python -I -c "from arkguardrl_core.native_runtime import kernel; from arkguardrl_core.gym_env import ArkGuardEnv; print(kernel().ABI)"
      - name: Keep one source distribution
        if: runner.os == 'Windows'
        run: rm dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
